name: Publicar convite (GitHub Pages)

# Publica o site automaticamente a cada atualização da branch main.
# Também dá para rodar manualmente em: Actions → Publicar convite → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações ao mesmo tempo; a mais nova substitui a anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Nome do repositório como subpasta do site (funciona também em forks com outro nome).
          BASE_PATH: /${{ github.event.repository.name }}/
          # Endereço do script do Google que grava as confirmações (veja docs/publicar-github-pages.md).
          VITE_RSVP_ENDPOINT: ${{ vars.VITE_RSVP_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
